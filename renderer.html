  window.addEventListener('error',e=>{if(active&&e.error)showRuntimeError(e.error)});
  window.addEventListener('unhandledrejection',e=>{if(active)showRuntimeError(e.reason||new Error('Unhandled promise rejection'))});
  try{resizeObserver=new ResizeObserver(()=>report(window.__lhToken));resizeObserver.observe(root);resizeObserver.observe(document.body)}catch(e){}
  window.addEventListener('resize',()=>report(window.__lhToken));
  window.addEventListener('beforeunload',()=>disposeHooks());
})();
</script>
</body></html>
